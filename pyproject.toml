[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "voice-to-order"
version = "0.1.0"
description = "Turn customer voicemails into structured orders using multiple speech-to-text providers and an LLM consensus step."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jahanzaib Ahmad" }]
dependencies = [
    "anthropic>=1,<2",
    "fastapi>=0.111",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# av<17: faster-whisper 1.2.x calls av.open(metadata_errors=...), which av 19 rejects.
local = ["faster-whisper>=1.0", "av<17"]
dev = [
    "httpx2>=2.0",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
voice-to-order = "voice_to_order.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_to_order"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "ffmpeg: requires the ffmpeg binary on PATH",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["voice_to_order"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Optional extra (`.[local]`); untyped and absent from the base install.
module = ["faster_whisper"]
ignore_missing_imports = true
